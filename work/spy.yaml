apiVersion: apps/v1
kind: DaemonSet  # 💡 spy-DaemonSet から修正
metadata:
  name: spy-daemonset
  namespace: default
  labels:
    app: spy
spec:
  selector:
    matchLabels:
      app: spy
  template:
    metadata:
      labels:
        app: spy
    spec:
      serviceAccountName: spy-service-account
      
      # =========================================================
      # 1. 初期化コンテナ（NFDのIP取得 ＆ 起動待ち）
      # =========================================================
      initContainers:
      - name: wait-nfd-
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        command: 
        - 'sh'
        - '-c'
        - |
          until [ -f /etc/ndn-config/nfd-ip ]; do 
            echo "waiting for nfd-config file to be mounted..."
            sleep 2
          done
          
          NFD_IP=$(cat /etc/ndn-config/nfd-ip)
          echo "Target NFD IP found: $NFD_IP"
          
          until nc -zvw3 "$NFD_IP" 6363; do
            echo "waiting for NFD at $NFD_IP:6363..."
            sleep 2
          done
        volumeMounts:
        - name: nfd-endpoint
          mountPath: /etc/ndn-config
          readOnly: true
          
      containers:
      - name: spy
        image: <あなたのレジストリ名>/ndn-spy:latest #コンテナイメージを書く、コンテナの中にspy.pyの実行を組み込む
        imagePullPolicy: Always
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
        - name: nfd-endpoint
          mountPath: /etc/ndn-config
          readOnly: true
        # ホストノード自体のリソース（CPU/メモリ）を取得するためにマウント
        - name: host-proc
          mountPath: /host/proc
          readOnly: true

      volumes:
      # NFDのIPが格納されているConfigMap
      - name: nfd-endpoint
        configMap:
          name: nfd-config
          optional: true
      # ノード物理マシンのリソース情報を覗くためのホストパス
      - name: host-proc
        hostPath:
          path: /proc
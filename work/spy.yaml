apiVersion: apps/v1
kind: DaemonSet  # 💡 spy-DaemonSet から修正
metadata:
  name: spy-daemonset
  namespace: default
  labels:
    app: spy
spec:
  selector:
    matchLabels:
      app: spy
  template:
    metadata:
      labels:
        app: spy
    spec:
      serviceAccountName: spy-service-account
      
      # 💡 NFDの起動（ソケットファイルの生成）を待つInitContainer
      initContainers:
      - name: wait-for-nfd
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        command: ['sh', '-c', 'until [ -S /var/run/nfd/nfd.sock ]; do echo "waiting for nfd.sock..."; sleep 2; done']
        volumeMounts:
        - name: nfd-socket-dir
          mountPath: /var/run/nfd
          
      containers:
      - name: spy
        image: <あなたのレジストリ名>/ndn-spy:latest 
        imagePullPolicy: IfNotPresent
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
        - name: nfd-socket-dir
          mountPath: /var/run/nfd 
      
      volumes:
      - name: nfd-socket-dir
        hostPath:
          # 💡 実験環境のNFDポッドがホスト側に公開しているソケットのパスと必ず一致させてください
          path: /var/run/nfd-k8s 
          type: DirectoryOrCreate
apiVersion: apps/v1
kind: spy-DaemonSet
metadata:
  name: spy
  namespace: default
  labels:
    app: spy
spec:
  selector:
    matchLabels:
      app: spy
  template:
    metadata:
      labels:
        app: spy
    spec:
      # 💡 spy-rbac.yaml で作成するServiceAccountをここで紐付け
      serviceAccountName: spy-service-account
      
      # 💡 NFDの起動（ソケットファイルの生成）を待つInitContainer
      initContainers:
      - name: wait-for-nfd
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        command: ['sh', '-c', 'until [ -S /var/run/nfd/nfd.sock ]; do echo "waiting for nfd.sock..."; sleep 2; done']
        volumeMounts:
        - name: nfd-socket-dir
          mountPath: /var/run/nfd
          
      containers:
      - name: spy
        image: <あなたのレジストリ名>/ndn-spy:latest # ビルドしたイメージを指定
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
        - name: nfd-socket-dir
          mountPath: /var/run/nfd # Python-NDNがNFDと通信するためのマウントパス
      
      volumes:
      # 💡 seed.yamlの運用に合わせたNFDソケット用のVolume設定
      - name: nfd-socket-dir
        hostPath:
          path: /var/run/nfd-k8s # ホスト側のパス（NFDがソケットを出力する場所）
          type: DirectoryOrCreate
name: Build and Push Docker Images

# ワークフローの実行トリガー
on:
  push:
    branches:
      - main # mainブランチにPushされた時に自動実行
  workflow_dispatch: # GitHub画面から手動で実行するためのボタンを表示

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # 1. リポジトリのコードを取得
      - name: Check out the repository
        uses: actions/checkout@v4

      # 2. Docker Buildxのセットアップ（マルチアーキテクチャビルドやキャッシュ等に便利）
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. GitHub Container Registryへのログイン
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Managerイメージのビルドとプッシュ
      - name: Build and push Manager Image
        uses: docker/build-push-action@v5
        with:
          context: ./work
          file: ./work/Dockerfile.manager
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/ndn-manager:latest

      # 5. Spyイメージのビルドとプッシュ
      - name: Build and push Spy Image
        uses: docker/build-push-action@v5
        with:
          context: ./work
          file: ./work/Dockerfile.spy
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/ndn-spy:latest
